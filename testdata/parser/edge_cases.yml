version: "3.9"

services:
  # empty service definition
  empty-service:
    image: nginx

  # service without ports
  no-ports:
    image: redis
    networks:
      - backend

  # service with networks only
  networks-only:
    image: postgres
    networks:
      backend:
        ipv4_address: 172.28.0.5

  # multiple ports (array)
  multi-ports:
    image: app
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002/udp"

  # object format ports
  object-ports:
    image: web
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        host_ip: 127.0.0.1

  # environment variables (array format)
  env-array:
    image: test
    environment:
      - NODE_ENV=production
      - DEBUG=true
      - API_KEY

  # environment variables (map format)
  env-map:
    image: test2
    environment:
      NODE_ENV: development
      DEBUG: "false"
      PORT: 4000

  # depends_on (array format)
  depends-array:
    image: app
    depends_on:
      - db
      - cache

  # depends_on (map format)
  depends-map:
    image: app2
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

networks:
  # empty network definition
  backend: {}

  # network without ipam
  frontend:
    driver: bridge

  # multiple subnets case
  multi-subnet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
