desc: "gopose E2E Test Suite"

vars:
  override_file: "compose.override.yml"

steps:
  - desc: "Dry-run mode works correctly"
    exec:
      command: |
        cd fixtures
        rm -f {{ vars.override_file }}
        ../../../gopose up --dry-run -f no-conflict.yml
        # Verify no file created in dry-run
        ! test -f {{ vars.override_file }}
    test: |
      current.exit_code == 0

  - desc: "No conflict case: gopose up with available ports"
    exec:
      command: |
        cd fixtures
        rm -f {{ vars.override_file }}
        ../../../gopose up -f no-conflict.yml
        # Cleanup any generated files
        rm -f {{ vars.override_file }}
    test: |
      current.exit_code == 0
      
  - desc: "Port conflict resolution works"
    exec:
      command: |
        ROOT_DIR=$(pwd)
        PID_FILE=/tmp/gopose_test.pid
        OCCUPY_BIN="$ROOT_DIR/occupy_port"
        FIXTURE_DIR="$ROOT_DIR/fixtures"

        cleanup() {
          if [ -f "$PID_FILE" ]; then
            kill "$(cat "$PID_FILE")" 2>/dev/null || true
            rm -f "$PID_FILE"
          fi
          rm -f "$OCCUPY_BIN" "$FIXTURE_DIR/{{ vars.override_file }}"
        }
        trap cleanup EXIT

        # Build and run Go port occupier
        go build -o "$OCCUPY_BIN" occupy_port.go
        "$OCCUPY_BIN" 8080 > /dev/null 2>&1 & echo $! > "$PID_FILE"
        sleep 2
        
        # Test conflict resolution
        cd "$FIXTURE_DIR"
        output=$(../../../gopose up -f port-conflict.yml --verbose 2>&1)
        echo "$output"

        # Assert port conflicts are actually detected and reported
        echo "$output" | grep -q "Port Conflicts:"
        echo "$output" | grep -q "SERVICE"
        echo "$output" | grep -q "web1"
    test: |
      current.exit_code == 0
