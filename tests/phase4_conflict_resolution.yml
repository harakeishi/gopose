desc: "Phase 4: Does gopose solve real problems? (Conflict Resolution)"

vars:
  override_file: "docker-compose.override.yml"
  conflict_compose: "conflict-compose.yml"

steps:
  - desc: "4.1 Setup: Clean any existing override files"
    exec:
      command: rm -f {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "4.2 Create a dummy process on port 8080 to force conflict"
    exec:
      command: bash -c "python3 -m http.server 8080 > /dev/null 2>&1 & echo $! > /tmp/test_server.pid"
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "4.3 Wait for server to start"
    exec:
      command: sleep 2
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "4.4 Run gopose up with conflict scenario"
    exec:
      command: ../gopose up -f {{ vars.conflict_compose }} --verbose
      workdir: fixtures
    test: |
      current.exit_code == 0 &&
      (current.stdout contains "衝突" || current.stderr contains "衝突")

  - desc: "4.5 Check if override file was created for conflict resolution"
    exec:
      command: test -f {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "4.6 Verify override file contains resolved ports"
    exec:
      command: cat {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code == 0 &&
      current.stdout != ""

  - desc: "4.7 Cleanup: Kill test server"
    exec:
      command: bash -c "if [ -f /tmp/test_server.pid ]; then kill $(cat /tmp/test_server.pid) 2>/dev/null || true; rm -f /tmp/test_server.pid; fi"
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "4.8 Cleanup: Remove override file"
    exec:
      command: rm -f {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code == 0