desc: "Phase 5: Does gopose clean up? (Cleanup and State Management)"

vars:
  override_file: "docker-compose.override.yml"

steps:
  - desc: "5.1 Create a dummy override file for cleanup test"
    exec:
      command: |
        cd fixtures
        bash -c "echo 'version: \"3.8\"' > {{ vars.override_file }}"
    test: |
      current.exit_code == 0

  - desc: "5.2 Verify override file exists before cleanup"
    exec:
      command: |
        cd fixtures
        test -f {{ vars.override_file }}
    test: |
      current.exit_code == 0

  - desc: "5.3 Test gopose clean command (may not be implemented yet)"
    exec:
      command: |
        cd fixtures
        ../../gopose clean
    test: |
      current.exit_code == 0 || 
      current.stderr contains "実装中" ||
      current.stderr contains "not implemented"

  - desc: "5.4 Test gopose status command (may not be implemented yet)"
    exec:
      command: |
        cd fixtures
        ../../gopose status
    test: |
      current.exit_code == 0 ||
      current.stderr contains "実装中" ||
      current.stderr contains "not implemented"

  - desc: "5.5 Manual cleanup: Remove test override file"
    exec:
      command: |
        cd fixtures
        rm -f {{ vars.override_file }}
    test: |
      current.exit_code == 0

  - desc: "5.6 Verify cleanup was successful"
    exec:
      command: |
        cd fixtures
        test -f {{ vars.override_file }}
    test: |
      current.exit_code != 0