desc: "Phase 1: Does gopose exist? (Smoke Test)"

steps:
  - desc: "1.1 Build gopose binary if needed"
    exec:
      command: |
        cd ..
        go build -o ./gopose .
    test: |
      current.exit_code == 0

  - desc: "1.2 Verify gopose binary exists"
    exec:
      command: ls -la ../gopose
    test: |
      current.exit_code == 0

  - desc: "1.3 Check gopose is executable"  
    exec:
      command: ../gopose --help
    test: |
      current.exit_code == 0 &&
      current.stdout contains "gopose" &&
      current.stdout contains "Docker Compose"