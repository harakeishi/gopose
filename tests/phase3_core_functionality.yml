desc: "Phase 3: Does gopose do what it says? (Core Functionality)"

vars:
  override_file: "docker-compose.override.yml"

steps:
  - desc: "3.1 Setup: Clean any existing override files"
    exec:
      command: rm -f {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "3.2 Dry-run should NOT create override file"
    exec:
      command: ../gopose up --dry-run -f basic-compose.yml
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "3.3 Verify no override file was created in dry-run"
    exec:
      command: ls {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code != 0  # File should not exist

  - desc: "3.4 Normal run with no conflicts should succeed"
    exec:
      command: ../gopose up -f basic-compose.yml
      workdir: fixtures
    test: |
      current.exit_code == 0

  - desc: "3.5 Check if override file was created (if conflicts exist)"
    exec:
      command: test -f {{ vars.override_file }}
      workdir: fixtures
    test: |
      # This may pass or fail depending on actual port conflicts
      # We'll log the result for analysis
      true

  - desc: "3.6 Cleanup: Remove any generated files"
    exec:
      command: rm -f {{ vars.override_file }}
      workdir: fixtures
    test: |
      current.exit_code == 0